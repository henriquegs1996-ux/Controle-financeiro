<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Financeiro</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.addEventListener('error',function(e){try{var el=document.getElementById('authMsg');if(el)el.textContent='Erro no sistema: '+(e.message||'verifique a página e tente novamente.')}catch(_){}});</script><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6fa;color:#182230}.wrap{max-width:1100px;margin:auto;padding:20px}.box{background:#fff;border-radius:14px;padding:20px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btn,input,select{padding:10px;border-radius:8px;border:1px solid #ddd}.btn{background:#3157d5;color:white;border:0;cursor:pointer}.danger{background:#d84a4a}.ok{color:#15956a}.err{color:#d84a4a}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.auth{max-width:420px;margin:8vh auto}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div id="auth" class="wrap auth"><div class="box"><h1>💰 Meu Financeiro</h1><p>Entre para usar os mesmos dados no computador e no celular.</p><input id="email" type="email" placeholder="E-mail" style="width:100%;box-sizing:border-box;margin:6px 0"><input id="password" type="password" placeholder="Senha" style="width:100%;box-sizing:border-box;margin:6px 0"><button class="btn" onclick="login()">Entrar</button> <button class="btn" onclick="signup()">Criar conta</button><p id="msg"></p></div></div><div id="app" class="wrap hidden"><div class="box"><h1>💰 Meu Financeiro</h1><p id="account"></p><button class="btn" onclick="logout()">Sair</button></div><div class="grid"><div class="box"><b>Receitas</b><h2 id="income">R$ 0,00</h2></div><div class="box"><b>Despesas</b><h2 id="expense">R$ 0,00</h2></div><div class="box"><b>Saldo</b><h2 id="balance">R$ 0,00</h2></div></div><div class="box"><h2>Novo lançamento</h2><select id="type"><option value="income">Receita</option><option value="expense">Despesa</option></select><input id="date" type="date"><input id="value" type="number" step="0.01" placeholder="Valor"><input id="desc" placeholder="Descrição"><input id="cat" placeholder="Categoria"><button class="btn" onclick="addEntry()">Salvar</button><p id="sync"></p></div><div class="box"><h2>Lançamentos</h2><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
const SUPABASE_URL='https://qtjfsrqkwtkpapqknikt.supabase.co';const SUPABASE_KEY='sb_publishable_Os-1E8BDOH1GtXT8E4I7Pg_AerAvOVN';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let user=null,entries=[];const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);const uid=()=>crypto.randomUUID();const msg=(t,ok=false)=>{document.getElementById('msg').textContent=t;document.getElementById('msg').className=ok?'ok':'err'};
async function boot(){const {data}=await sb.auth.getSession();if(data.session)enter(data.session.user);else document.getElementById('auth').classList.remove('hidden');sb.auth.onAuthStateChange((_,s)=>{if(s)enter(s.user);else{user=null;document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('hidden')}})}
async function login(){const emailEl=document.getElementById('email'),passwordEl=document.getElementById('password');const emailValue=emailEl.value.trim(),passwordValue=passwordEl.value;if(!emailValue||!passwordValue){msg('Digite o e-mail e a senha.');return}msg('Entrando...',true);try{const r=await sb.auth.signInWithPassword({email:emailValue,password:passwordValue});if(r.error){msg('Erro ao entrar: '+r.error.message);return}if(r.data&&r.data.session){await enter(r.data.session.user)}else{msg('Login realizado, mas a sessão não foi criada. Tente novamente.')}}catch(e){msg('Não foi possível entrar: '+(e?.message||e))}}async function signup(){const emailEl=document.getElementById('email'),passwordEl=document.getElementById('password');const emailValue=emailEl.value.trim(),passwordValue=passwordEl.value;if(!emailValue||!passwordValue){msg('Digite o e-mail e a senha.');return}if(passwordValue.length<6){msg('A senha precisa ter pelo menos 6 caracteres.');return}msg('Criando conta...',true);try{const r=await sb.auth.signUp({email:emailValue,password:passwordValue});if(r.error){msg('Erro ao criar conta: '+r.error.message);return}if(r.data.session){await enter(r.data.session.user)}else{msg('Conta criada. Se o Supabase pedir confirmação de e-mail, confirme e depois clique em Entrar.',true)}}catch(e){msg('Não foi possível criar a conta: '+(e?.message||e))}}async function logout(){await sb.auth.signOut()}
async function enter(u){user=u;auth.classList.add('hidden');app.classList.remove('hidden');account.textContent=u.email||'';date.value=new Date().toISOString().slice(0,10);await load()}
async function load(){sync.textContent='☁️ Sincronizando...';const r=await sb.from('finance_entries').select('*').eq('user_id',user.id).order('date',{ascending:false});if(r.error){sync.textContent='⚠️ '+r.error.message;return}entries=(r.data||[]).map(x=>({id:x.id,type:x.type,date:x.date,value:Number(x.value),desc:x.description,cat:x.category||'Outros',status:x.status||'paid',method:x.method||'Outro'}));localStorage.setItem('finance_v2_data',JSON.stringify({entries,bills:[],cats:[],planning:{}}));render();sync.textContent='☁️ Sincronizado'}
async function addEntry(){const x={id:uid(),user_id:user.id,type:type.value,value:Number(value.value),description:desc.value.trim(),category:cat.value.trim()||'Outros',date:date.value,status:'paid',method:'Outro'};if(!x.value||!x.description||!x.date)return alert('Preencha data, valor e descrição.');sync.textContent='☁️ Salvando...';const r=await sb.from('finance_entries').insert(x);if(r.error){sync.textContent='⚠️ '+r.error.message;return}entries.unshift({id:x.id,type:x.type,date:x.date,value:x.value,desc:x.description,cat:x.category,status:x.status,method:x.method});value.value='';desc.value='';cat.value='';render();sync.textContent='☁️ Sincronizado'}
async function delEntry(id){if(!confirm('Excluir este lançamento?'))return;const r=await sb.from('finance_entries').delete().eq('id',id).eq('user_id',user.id);if(r.error)return alert(r.error.message);entries=entries.filter(x=>x.id!==id);render()}
function render(){let inc=entries.filter(x=>x.type==='income').reduce((a,x)=>a+x.value,0),exp=entries.filter(x=>x.type==='expense').reduce((a,x)=>a+x.value,0);income.textContent=money(inc);expense.textContent=money(exp);balance.textContent=money(inc-exp);rows.innerHTML=entries.map(x=>`<tr><td>${new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR')}</td><td>${esc(x.desc)}</td><td>${esc(x.cat)}</td><td>${x.type==='income'?'Receita':'Despesa'}</td><td>${money(x.value)}</td><td><button class="btn danger" onclick="delEntry('${x.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6">Nenhum lançamento.</td></tr>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}boot();
</script></body></html>
